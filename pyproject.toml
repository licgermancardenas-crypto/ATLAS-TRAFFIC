[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "atlas-traffic"
version = "0.1.0"
description = "Pipeline de visión por computadora para análisis de tránsito en una bocacalle: conteo único por aproximación, congestión por densidad + velocidad y dashboard comparativo multi-clip."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "ATLAS Analytics" }]
dependencies = [
    "numpy>=1.26",
    "opencv-python>=4.9",
    "pandas>=2.2",
    "pyarrow>=15",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "typer>=0.12",
]

[project.optional-dependencies]
# Motor de detección. Ultralytics es AGPL-3.0: queda como extra para que el
# núcleo (y los tests) no dependan de él. Ver brief §4c y §8.
detect = ["ultralytics>=8.3", "lap>=0.5"]
dashboard = ["streamlit>=1.38", "altair>=5.3"]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
atlas-traffic = "atlas_traffic.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/atlas_traffic"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

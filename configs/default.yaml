# Configuración general del pipeline. Validada por atlas_traffic.config.AppConfig.

deteccion:
  detector: ultralytics      # nombre en el registro de detect.py (ultralytics | fake)
  modelo: yolov8n.pt         # yolov8n para iterar, yolov8s para la corrida final
  dispositivo: cpu
  confianza_min: 0.1        # bajo a propósito: ByteTrack usa las detecciones débiles para re-asociar
  iou: 0.5
  tracker: configs/bytetrack.yaml
  imgsz: 640

video:
  paso_frames: 2             # 1 de cada 2 frames: 60 fps -> 30 fps efectivos

estabilizacion:             # compensa movimiento de cámara (ver stabilize.py)
  activa: true               # con cámara fija la H es ~identidad: no hace daño
  frame_referencia: 0        # la geometría del encuadre se marca sobre este frame
  max_puntos: 1500           # puntos ORB por frame (3000 = el doble de lento, ~3 px más preciso)
  min_inliers: 40
  umbral_ransac_px: 3.0
  ventana_suavizado: 9       # promedia la H en ~0.3 s: quita el temblor de la estimación

metricas:
  intervalo_s: 30            # ventana de agregación de intervalos.parquet
  ventana_velocidad_s: 0.33  # velocidad = desplazamiento en ventanas de este largo

conteo:
  margen_px: 4               # banda muerta: un auto quieto sobre la línea no cuenta cruces

color:
  max_frames: 10             # frames muestreados por track
  solape_max: 0.4            # descarta frames con solape de cajas mayor a esto
  confianza_min: 0.5         # por debajo, color = indefinido
  sat_min: 40                # HSV (0-255): saturación menor -> blanco / gris / negro
  brillo_relativo: true      # negro/blanco relativos al asfalto de alrededor
  r_negro: 0.6               # V < 0.6 x fondo -> negro (calibrado, ver docs/validacion_color.md)
  r_blanco: 1.3              # acromático con V >= 1.3 x fondo -> blanco
  v_negro: 60                # umbrales absolutos: solo si no se puede medir el fondo
  v_blanco: 170

alertas:
  min_frames_historia: 15    # ignora tracks más cortos (ruido del tracker)
  min_desplazamiento_px: 40  # ignora vehículos detenidos con jitter
  frames_limpios: 3          # frames a cada lado de la línea para validar el cruce

render:
  escala: 1.5                # el video anotado se agranda para que el texto se lea
  gif_inicio_s: 0            # tramo del GIF de muestra
  gif_duracion_s: 6
  gif_ancho: 320             # chico a propósito: no deja leer patentes ni ver caras
  gif_fps: 8
  gif_colores: 64            # paleta común; 320 px x 8 fps x 6 s ~ 4 MB

rutas:
  clips: configs/clips.yaml
  calibracion: configs/calibracion.yaml
  outputs: outputs

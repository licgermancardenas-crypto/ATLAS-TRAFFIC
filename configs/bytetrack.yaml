# ByteTrack ajustado para ATLAS Traffic (60 fps, objetos chicos, cámara en balcón).
# Base: ultralytics/cfg/trackers/bytetrack.yaml. Cambios comentados.
tracker_type: bytetrack
track_high_thresh: 0.25
track_low_thresh: 0.1
new_track_thresh: 0.3   # base 0.25: algo más exigente para abrir IDs nuevos
track_buffer: 90        # base 30: a 60 fps, 30 frames = 0.5 s; 90 = 1.5 s de oclusión tolerada
match_thresh: 0.8
fuse_score: true

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    name: Lint y tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Librerías del sistema para OpenCV
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgl1 libglib2.0-0

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"

      # Sin el extra `detect`: los tests usan FakeDetector y no necesitan YOLO ni torch.
      - name: Instalar
        run: uv pip install --system -e ".[dev,dashboard]"

      - name: Lint
        run: ruff check .

      - name: Formato
        run: ruff format --check .

      - name: Tests
        run: pytest

  docker:
    name: Imagen Docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Construir imagen
        run: docker build -t atlas-traffic:ci .
      - name: El CLI responde dentro de la imagen
        run: docker run --rm atlas-traffic:ci --help

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    name: Lint y tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Librerías del sistema para OpenCV
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgl1 libglib2.0-0

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
          activate-environment: true  # crea .venv y lo deja activo para los pasos siguientes

      # Sin el extra `detect`: los tests usan FakeDetector y no necesitan YOLO ni torch.
      - name: Instalar
        run: uv pip install -e ".[dev,dashboard]"

      - name: Lint
        run: ruff check .

      - name: Formato
        run: ruff format --check .

      - name: Tests
        run: pytest

  docker:
    name: Imagen Docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Construir imagen
        run: docker build -t atlas-traffic:ci .
      - name: El CLI responde dentro de la imagen
        run: docker run --rm atlas-traffic:ci --help
      - name: El modelo de la esquina está en la imagen y carga
        run: >-
          docker run --rm --entrypoint python atlas-traffic:ci -c
          "from atlas_traffic.config import load_app_config;
          from atlas_traffic.detect import crear_detector;
          c = load_app_config();
          d = crear_detector(c.deteccion.detector, **c.deteccion.kwargs_motor());
          print('modelo ok:', c.deteccion.modelo, d._model.names)"
